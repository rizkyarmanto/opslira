<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opslira · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Opslira monitoring platform</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Opslira monitoring platform</title>
        <desc id="architecture-desc">Architecture diagram showing the operator browser talking to the Laravel web app, which uses PostgreSQL, Redis, Gotenberg and notification channels, while a Go runner claims probe work over internal endpoints and probe adapters execute the seven probe protocols.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="40" y="92" width="200" height="504" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="96" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="90" y="105" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">OPERATOR</text>

        <rect x="288" y="92" width="640" height="504" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="300" y="96" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="330" y="105" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">RUNTIME</text>

        <rect x="968" y="92" width="272" height="504" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="980" y="96" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1024" y="105" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">EXTERNAL / SCHED</text>

        <!-- Arrows (behind boxes) -->

        <!-- Browser -> Laravel Web : plain horizontal line, link color (HTTP) -->
        <line x1="240" y1="224" x2="372" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="256" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INERTIA</text>

        <!-- Laravel Web -> PostgreSQL : SQL, down from web bottom edge into PG top edge -->
        <path d="M 436,272 V 356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="344" y="308" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

        <!-- Laravel Web -> Redis : STATE, down from web bottom edge into Redis top edge -->
        <path d="M 604,272 V 356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="516" y="308" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="538" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE</text>

        <!-- Laravel Web -> Gotenberg : PDF, down and across, link color (HTTP) -->
        <path d="M 764,272 V 312 H 1024 V 356" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="868" y="288" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="884" y="297" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PDF</text>

        <!-- Laravel Web -> Notifications : NOTIFY, down and across, link color (HTTP/webhook) -->
        <path d="M 828,272 V 328 H 1124 V 356" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="868" y="304" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="894" y="313" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFY</text>

        <!-- Go Runner -> Laravel Web : CLAIM + PROBE over internal endpoints, link color (HTTP), hopped over the INERTIA row -->
        <path d="M 120,392 H 264 a 8,8 0 0,1 16,0 H 372" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="140" y="368" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="190" y="377" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM + PROBE</text>

        <!-- Laravel Web -> Probe Adapters : internal dispatch, plain vertical line -->
        <line x1="692" y1="272" x2="692" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="608" y="308" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <!-- Nodes -->
        <!-- Browser (input) -->
        <rect x="72" y="192" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="192" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="100" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="156" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
        <text x="156" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Inertia React NOC</text>

        <!-- Laravel Web FPM (focal) -->
        <rect x="384" y="160" width="448" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="160" width="448" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="392" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="412" y="177" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text>
        <text x="608" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laravel Web FPM</text>
        <text x="608" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dashboard · Targets · Incidents · Reporting</text>

        <!-- Go Runner (backend) -->
        <rect x="72" y="360" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="360" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="100" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text>
        <text x="156" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Go Runner</text>
        <text x="156" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tick 15s · report 60s</text>

        <!-- Probe Adapters (backend, merged) -->
        <rect x="568" y="360" width="248" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="360" width="248" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="576" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="596" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text>
        <text x="692" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe Adapters</text>
        <text x="692" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7 protocols · ICMP SNMP HTTP ...</text>

        <!-- PostgreSQL 16 (store) -->
        <rect x="288" y="360" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="360" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="296" y="368" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="312" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="408" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL 16</text>
        <text x="408" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">monitoring_logs · partitions</text>

        <!-- Redis 7 (store) -->
        <rect x="568" y="464" width="248" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="464" width="248" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="576" y="472" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="592" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="692" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis 7</text>
        <text x="692" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state · queue · cache</text>

        <!-- Gotenberg 8 (external) -->
        <rect x="992" y="360" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="992" y="360" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1000" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1022" y="377" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="1092" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gotenberg 8</text>
        <text x="1092" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chromium PDF</text>

        <!-- Email / Telegram / Slack (external) -->
        <rect x="992" y="464" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="992" y="464" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1000" y="472" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1022" y="481" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="1092" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email · Telegram · Slack</text>
        <text x="1092" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AlertNotificationService</text>

        <!-- Legend strip -->
        <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="664" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

        <rect x="140" y="664" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <rect x="252" y="664" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="272" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="348" y="664" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="368" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <rect x="460" y="664" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="480" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <line x1="560" y1="669" x2="588" y2="669" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="596" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

        <line x1="700" y1="669" x2="728" y2="669" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="736" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal data flow</text>

        <rect x="900" y="664" width="24" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="932" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Zone</text>
      </svg>
    </div>
  </div>
</body>
</html>
