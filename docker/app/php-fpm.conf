; Overrides the stock [www] pool (loaded last because of the zz- prefix).
;
; Probes now run inside FPM requests triggered by the Go runner, so the pool has
; to hold the runner's concurrency (PROBE_CONCURRENCY=8) plus normal page
; traffic. The image default of 5 children would throttle it.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Matches the 300s FastCGI timeout: a runaway request is killed, not left open.
request_terminate_timeout = 300s
