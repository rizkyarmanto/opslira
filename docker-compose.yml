services:
  # Nginx + Laravel app (FPM) — exposed on :8080
  # NET_RAW required for ICMP ping, which now runs inside FPM.
  monitoring-web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: monitoring-web
    restart: unless-stopped
    ports:
      - "8080:80"
    cap_add:
      - NET_RAW
    environment:
      # Runner token must match monitoring-runner, otherwise /internal answers 401.
      OPSLIRA_RUNNER_TOKEN: ${OPSLIRA_RUNNER_TOKEN:-}
      # Leave false while monitoring-runner is alive, or every job runs twice.
      RUN_ARTISAN_WORKERS: ${RUN_ARTISAN_WORKERS:-false}
      RUN_ARTISAN_QUEUE: ${RUN_ARTISAN_QUEUE:-false}
      ARTISAN_QUEUE_NAMES: ${ARTISAN_QUEUE_NAMES:-alerts,probes,reports}
      ARTISAN_PROBE_SECONDS: ${ARTISAN_PROBE_SECONDS:-60}
      ARTISAN_REPORT_SECONDS: ${ARTISAN_REPORT_SECONDS:-60}
      ARTISAN_ROLLUP_SECONDS: ${ARTISAN_ROLLUP_SECONDS:-3600}
      ARTISAN_PRUNE_SECONDS: ${ARTISAN_PRUNE_SECONDS:-86400}
    volumes:
      - report_storage:/var/www/html/storage/app/reports
    depends_on:
      - monitoring-postgres
      - monitoring-redis
      - monitoring-gotenberg

  # Go runner — the one process that owns all periodic work: probe scheduling,
  # report dispatch, rollup and partition prune. Probes still execute in PHP
  # through the internal endpoints of monitoring-web.
  monitoring-runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    container_name: monitoring-runner
    restart: unless-stopped
    environment:
      OPSLIRA_BASE_URL: http://monitoring-web
      OPSLIRA_RUNNER_TOKEN: ${OPSLIRA_RUNNER_TOKEN:-}
      PROBE_CONCURRENCY: "8"
      RUNNER_TICK_SECONDS: "15"
      RUNNER_TIMEZONE: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - monitoring-postgres
      - monitoring-redis
      - monitoring-web

  # Gotenberg — headless Chromium HTML→PDF
  monitoring-gotenberg:
    image: gotenberg/gotenberg:8
    container_name: monitoring-gotenberg
    restart: unless-stopped

  # PostgreSQL 16 — partitioned log storage
  monitoring-postgres:
    image: postgres:16-alpine
    container_name: monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: internal_monitoring
      POSTGRES_USER: mon_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-strong-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_admin -d internal_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 — queue + state cache (AOF on)
  monitoring-redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  report_storage:
