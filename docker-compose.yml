services:
  # Nginx + Laravel app (FPM) — exposed on :8080
  monitoring-web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: monitoring-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - report_storage:/var/www/html/storage/app/reports
    depends_on:
      - monitoring-postgres
      - monitoring-redis

  # Master Scheduler (singleton)
  monitoring-scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: monitoring-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - monitoring-postgres
      - monitoring-redis

  # Probe + alert workers (replicas: 3). NET_RAW required for ICMP ping.
  monitoring-worker-probes:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=alerts,probes", "--sleep=1", "--tries=1", "--timeout=15"]
    deploy:
      replicas: 3
    cap_add:
      - NET_RAW
    depends_on:
      - monitoring-postgres
      - monitoring-redis

  # Report worker — PDF/Excel generation + email dispatch
  monitoring-worker-reports:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: monitoring-worker-reports
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=reports", "--sleep=3", "--tries=3", "--backoff=60,300,900", "--timeout=120"]
    volumes:
      - report_storage:/var/www/html/storage/app/reports
    depends_on:
      - monitoring-postgres
      - monitoring-redis
      - monitoring-gotenberg

  # Gotenberg — headless Chromium HTML→PDF
  monitoring-gotenberg:
    image: gotenberg/gotenberg:8
    container_name: monitoring-gotenberg
    restart: unless-stopped

  # PostgreSQL 16 — partitioned log storage
  monitoring-postgres:
    image: postgres:16-alpine
    container_name: monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: internal_monitoring
      POSTGRES_USER: mon_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-strong-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_admin -d internal_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 — queue + state cache (AOF on)
  monitoring-redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  report_storage:
