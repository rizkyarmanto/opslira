server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml image/png;

    # Hashed build assets are immutable; index.html must always be revalidated
    # so a new deploy is picked up without cache-busting.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every route falls through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
